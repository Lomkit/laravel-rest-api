name: tests

on:
  push:
    branches: [ main, 3.x ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.3', '8.4', '8.5' ]
        database: [ 'sqlite' ]
        dependencies: [ 'highest' ]
        include:
          # Database drivers only need covering once, on the newest PHP
          - php-version: '8.5'
            database: 'mysql'
            dependencies: 'highest'
          - php-version: '8.5'
            database: 'pgsql'
            dependencies: 'highest'
          # The oldest versions allowed by composer.json
          - php-version: '8.3'
            database: 'sqlite'
            dependencies: 'lowest'

    name: PHP ${{ matrix.php-version }} - ${{ matrix.database }} - ${{ matrix.dependencies }}

    services:
      # An empty image skips the service, so each job only starts the database it uses
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: rest
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      pgsql:
        image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rest
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # Only downloaded archives are cached; dependencies are resolved on every run,
      # so new releases and composer.json changes are always picked up
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-${{ matrix.dependencies }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Run test suite with SQLite
        if: matrix.database == 'sqlite'
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Run test suite with MySQL
        if: matrix.database == 'mysql'
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: mysql
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_DATABASE: rest
          DB_USERNAME: root

      - name: Run test suite with PostgreSQL
        if: matrix.database == 'pgsql'
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: pgsql
          DB_PORT: ${{ job.services.pgsql.ports[5432] }}
          DB_DATABASE: rest
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
