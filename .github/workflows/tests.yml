name: tests

on:
  push:
    branches: [ main, 3.x ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.3', '8.4', '8.5' ]
        database: [ 'sqlite' ]
        dependencies: [ 'highest' ]
        scout: [ 'installed' ]
        include:
          # Database drivers only need covering once, on the newest PHP
          - php-version: '8.5'
            database: 'mysql'
            dependencies: 'highest'
            scout: 'installed'
          - php-version: '8.5'
            database: 'pgsql'
            dependencies: 'highest'
            scout: 'installed'
          # The oldest versions allowed by composer.json
          - php-version: '8.3'
            database: 'sqlite'
            dependencies: 'lowest'
            scout: 'installed'
          # laravel/scout is only suggested: the package must work without it
          - php-version: '8.3'
            database: 'sqlite'
            dependencies: 'highest'
            scout: 'absent'
          # The engine tests against real Meilisearch and Typesense servers, and Algolia through recorded responses
          - php-version: '8.5'
            database: 'sqlite'
            dependencies: 'highest'
            scout: 'engines'

    name: PHP ${{ matrix.php-version }} - ${{ matrix.database }} - ${{ matrix.dependencies }} - scout ${{ matrix.scout }}

    services:
      # An empty image skips the service, so each job only starts the services it uses
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: rest
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      pgsql:
        image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rest
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      meilisearch:
        image: ${{ matrix.scout == 'engines' && 'getmeili/meilisearch:v1.55.0' || '' }}
        env:
          MEILI_MASTER_KEY: lrapi-ci-master-key
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700
        options: --health-cmd "curl -sf http://127.0.0.1:7700/health" --health-interval 5s --health-timeout 3s --health-retries 12

      # The image has no curl or wget: the step "Wait for Typesense" polls /health from the runner
      typesense:
        image: ${{ matrix.scout == 'engines' && 'typesense/typesense:30.1' || '' }}
        env:
          TYPESENSE_API_KEY: lrapi-ci-api-key
          TYPESENSE_DATA_DIR: /tmp
        ports:
          - 8108:8108

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Remove Laravel Scout
        if: matrix.scout == 'absent'
        run: composer remove --dev laravel/scout --no-update --no-interaction

      - name: Add the search engine clients
        if: matrix.scout == 'engines'
        run: |
          composer config allow-plugins.php-http/discovery true
          composer require --dev --no-update --no-interaction "meilisearch/meilisearch-php:^1.17" "typesense/typesense-php:^4.9.3" "algolia/algoliasearch-client-php:^4.0"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # Only downloaded archives are cached; dependencies are resolved on every run,
      # so new releases and composer.json changes are always picked up
      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ matrix.scout }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-${{ matrix.dependencies }}-${{ matrix.scout }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Check that Laravel Scout is absent
        if: matrix.scout == 'absent'
        run: test ! -d vendor/laravel/scout

      - name: Run test suite with SQLite
        if: matrix.database == 'sqlite' && matrix.scout == 'installed'
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Run test suite with MySQL
        if: matrix.database == 'mysql' && matrix.scout == 'installed'
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: mysql
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
          DB_DATABASE: rest
          DB_USERNAME: root

      - name: Run test suite with PostgreSQL
        if: matrix.database == 'pgsql' && matrix.scout == 'installed'
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: pgsql
          DB_PORT: ${{ job.services.pgsql.ports['5432'] }}
          DB_DATABASE: rest
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Run test suite without Laravel Scout
        if: matrix.scout == 'absent'
        run: vendor/bin/phpunit --exclude-group scout --exclude-group meilisearch --exclude-group typesense --exclude-group algolia
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Wait for Typesense
        if: matrix.scout == 'engines'
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors "http://127.0.0.1:${{ job.services.typesense.ports['8108'] }}/health"

      - name: Run the search engine tests
        if: matrix.scout == 'engines'
        run: vendor/bin/phpunit --group meilisearch --group typesense --group algolia --fail-on-skipped --fail-on-empty-test-suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          MEILISEARCH_HOST: http://127.0.0.1:${{ job.services.meilisearch.ports['7700'] }}
          MEILISEARCH_KEY: lrapi-ci-master-key
          TYPESENSE_HOST: 127.0.0.1
          TYPESENSE_PORT: ${{ job.services.typesense.ports['8108'] }}
          TYPESENSE_PROTOCOL: http
          TYPESENSE_API_KEY: lrapi-ci-api-key

  coverage:

    runs-on: ubuntu-latest

    name: Coverage

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-highest-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-highest-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run test suite with coverage
        run: vendor/bin/phpunit --coverage-text
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
